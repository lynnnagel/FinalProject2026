<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LURA — התחברות</title>
  <link rel="stylesheet" href="css/main.css">
    <link rel="icon" href="icons/icon128.png">
</head>
<body class="auth-page">

  <div class="auth-container">
        <div class="auth-brand"><img src="icons/icon128.png" alt="LURA" style="height:28px;vertical-align:middle;margin-left:6px;">LURA</div>
    <p class="auth-sub">הגנה חכמה מפני פישינג</p>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin"    onclick="showTab('login')">התחברות</button>
      <button class="auth-tab"        id="tabRegister" onclick="showTab('register')">הרשמה</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="auth-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>כתובת מייל</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required dir="ltr">
      </div>
      <div class="form-group">
        <label>סיסמה</label>
        <input type="password" id="loginPassword" placeholder="הזן סיסמה" required>
      </div>
      <div id="loginError" class="form-error" style="display:none"></div>
      <button type="submit" class="btn-primary btn-full">התחבר</button>
      <p class="auth-switch">
        אין לך חשבון? <a href="#" onclick="showTab('register')">הרשם עכשיו</a>
        &nbsp;·&nbsp;
        <a href="forgot_password.html">שכחתי סיסמה</a>
      </p>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="auth-form" style="display:none" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>שם מלא</label>
        <input type="text" id="regName" placeholder="שם מלא">
      </div>
      <div class="form-group">
        <label>כתובת מייל</label>
        <input type="email" id="regEmail" placeholder="you@example.com" required dir="ltr">
      </div>
      <div class="form-group">
        <label>סיסמה</label>
        <input type="password" id="regPassword" placeholder="לפחות 6 תווים" required>
      </div>
      <div class="form-group">
        <label>אימות סיסמה</label>
        <input type="password" id="regPassword2" placeholder="הזן שוב את הסיסמה" required>
      </div>
      <div id="registerError" class="form-error" style="display:none"></div>
      <button type="submit" class="btn-primary btn-full">צור חשבון</button>
      <p class="auth-switch">
        יש לך כבר חשבון? <a href="#" onclick="showTab('login')">התחבר</a>
      </p>
    </form>

    <!-- Reset Password Form -->
    <form id="resetForm" class="auth-form" style="display:none" onsubmit="handleReset(event)">
      <p style="font-size:13px;color:var(--muted);margin-bottom:4px;">
        הזיני את כתובת המייל שלך וסיסמה חדשה.
      </p>
      <div class="form-group">
        <label>כתובת מייל</label>
        <input type="email" id="resetEmail" placeholder="you@example.com" required dir="ltr">
      </div>
      <div class="form-group">
        <label>סיסמה חדשה</label>
        <input type="password" id="resetPassword" placeholder="לפחות 6 תווים" required>
      </div>
      <div class="form-group">
        <label>אימות סיסמה חדשה</label>
        <input type="password" id="resetPassword2" placeholder="הזן שוב" required>
      </div>
      <div id="resetError"   class="form-error"   style="display:none"></div>
      <div id="resetSuccess" class="form-success" style="display:none"></div>
      <button type="submit" class="btn-primary btn-full">עדכן סיסמה</button>
      <p class="auth-switch"><a href="#" onclick="showTab('login')">חזרה להתחברות</a></p>
    </form>

  </div>

  <script src="js/login.js"></script>
</body>
</html>
