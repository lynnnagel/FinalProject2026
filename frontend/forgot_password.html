<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LURA — איפוס סיסמה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" href="icons/icon128.png">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-brand">
      <img src="icons/icon128.png" alt="LURA" style="height:28px;vertical-align:middle;margin-left:6px;">LURA
    </div>
    <p class="auth-sub">איפוס סיסמה</p>

    <!-- שלב 1 — בקשת קישור למייל -->
    <form id="requestForm" class="auth-form" onsubmit="handleRequest(event)">
      <p style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:8px;">
        הזיני את כתובת המייל הרשומה שלך. נשלח אליה קישור לבחירת סיסמה חדשה.
      </p>
      <div class="form-group">
        <label>כתובת מייל</label>
        <input type="email" id="requestEmail" placeholder="you@example.com" required dir="ltr">
      </div>
      <div id="requestError"   class="form-error"   style="display:none"></div>
      <div id="requestSuccess" class="form-success" style="display:none"></div>
      <button type="submit" class="btn-primary btn-full">שלח קישור לאיפוס</button>
      <p class="auth-switch"><a href="login.html">חזרה להתחברות</a></p>
    </form>

    <!-- שלב 2 — בחירת סיסמה חדשה (מוצג רק כשיש token בכתובת) -->
    <form id="resetForm" class="auth-form" onsubmit="handleReset(event)" style="display:none">
      <p style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:8px;">
        בחרי סיסמה חדשה לחשבון שלך.
      </p>
      <div class="form-group">
        <label>סיסמה חדשה</label>
        <input type="password" id="resetPassword" placeholder="לפחות 8 תווים" required>
      </div>
      <div class="form-group">
        <label>אימות סיסמה חדשה</label>
        <input type="password" id="resetPassword2" placeholder="הזיני שוב" required>
      </div>
      <div id="resetError"   class="form-error"   style="display:none"></div>
      <div id="resetSuccess" class="form-success" style="display:none"></div>
      <button type="submit" class="btn-primary btn-full">עדכני סיסמה</button>
      <p class="auth-switch"><a href="login.html">חזרה להתחברות</a></p>
    </form>
  </div>

<script src="js/forgot_password.js"></script>
</body>
</html>
