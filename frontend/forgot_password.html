<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhishGuard — איפוס סיסמה</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-brand">🛡️ PhishGuard</div>
    <p class="auth-sub">איפוס סיסמה</p>

    <!-- Step 1: enter email + new password -->
    <form id="resetForm" class="auth-form" onsubmit="handleReset(event)">
      <p style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:8px;">
        הזיני את כתובת המייל הרשומה שלך וסיסמה חדשה.
      </p>
      <div class="form-group">
        <label>כתובת מייל</label>
        <input type="email" id="resetEmail" placeholder="you@example.com" required dir="ltr">
      </div>
      <div class="form-group">
        <label>סיסמה חדשה</label>
        <input type="password" id="resetPassword" placeholder="לפחות 6 תווים" required>
      </div>
      <div class="form-group">
        <label>אימות סיסמה חדשה</label>
        <input type="password" id="resetPassword2" placeholder="הזן שוב" required>
      </div>
      <div id="resetError"   class="form-error"   style="display:none"></div>
      <div id="resetSuccess" class="form-success" style="display:none"></div>
      <button type="submit" class="btn-primary btn-full">עדכן סיסמה</button>
      <p class="auth-switch">
        <a href="login.html">חזרה להתחברות</a>
      </p>
    </form>
  </div>

<script src="js/forgot_password.js"></script>
</body>
</html>
