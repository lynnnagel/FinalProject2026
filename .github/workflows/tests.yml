name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Every `run` step below starts in backend/, the directory the tests
    # are run from locally. conftest.py puts that directory on sys.path,
    # so imports like `from models import ...` only resolve from there.
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run tests
        run: pytest -v